schema_version: "formal-1.0"
formal_scale:
  usv_count: 1
  uav_count: 6
  charger_count: 2
  immutable: true

scale_experiment_policy:
  vary_only: task_count
  forbid_resource_override: true

resource_sensitivity:
  fixed_task_counts: [50, 100, 200]
  uav_count: [4, 6, 8]
  charger_count: [1, 2, 3]
  one_factor_at_a_time: true
  baseline_uav_count: 6
  baseline_charger_count: 2

